<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="description" content="TaskFlow - Manage your daily tasks" />

    <!-- FONT AWESOME -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />

    <!-- GLOBAL CSS -->
    <link rel="stylesheet" href="/src/styles/variables.css" />
    <link rel="stylesheet" href="/src/styles/themes.css" />
    <link rel="stylesheet" href="/src/styles/main.css" />
    <link rel="stylesheet" href="/src/styles/layout.css" />

    <!-- TASKS CSS -->
    <link rel="stylesheet" href="/src/styles/responsive.css" />
    <link rel="stylesheet" href="/src/styles/calendar.css" />
    <title>TaskFlow | Calendar</title>
  </head>

  <body>
    <div id="app">
      <!-- SIDEBAR -->
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
          <button
            class="sidebar-toggle"
            id="sidebarToggle"
            aria-label="Toggle sidebar"
          >
            <i class="fa-solid fa-bars"></i>
          </button>
          <h2 class="sidebar-logo">TaskFlow</h2>
        </div>

        <nav class="sidebar-nav">
          <a href="/index.html" class="nav-link">
            <i class="fa-solid fa-house"></i>
            <span>Dashboard</span>
          </a>

          <a href="/task.html" class="nav-link">
            <i class="fa-solid fa-list-check"></i>
            <span>Tasks</span>
          </a>

          <a href="/calendar.html" class="nav-link active">
            <i class="fa-solid fa-calendar-days"></i>
            <span>Calendar</span>
          </a>

          <a href="#" class="nav-link">
            <i class="fa-solid fa-bullseye"></i>
            <span>Goals</span>
          </a>

          <a href="#" class="nav-link">
            <i class="fa-solid fa-stopwatch"></i>
            <span>Focus Timer</span>
          </a>

          <a href="#" class="nav-link">
            <i class="fa-solid fa-repeat"></i>
            <span>Habits</span>
          </a>

          <a href="#" class="nav-link">
            <i class="fa-solid fa-chart-line"></i>
            <span>Statistics</span>
          </a>
        </nav>

        <div class="sidebar-bottom">
          <a href="#" class="nav-link">
            <i class="fa-solid fa-gear"></i>
            <span>Settings</span>
          </a>
        </div>
      </aside>

      <!-- SIDEBAR OVERLAY -->
      <div class="sidebar-overlay" id="sidebarOverlay"></div>

      <!-- MAIN LAYOUT -->
      <div class="main-layout">
        <!-- TOPBAR -->
        <header class="topbar">
          <div class="topbar-left">
            <button
              class="mobile-menu-btn"
              id="mobileMenuBtn"
              aria-label="Open sidebar"
            >
              <i class="fa-solid fa-bars"></i>
            </button>

            <div class="page-heading">
              <h2>Calendar</h2>
              <p>Plan your time and organize your tasks.</p>
            </div>
          </div>

          <div class="topbar-right">
            <div class="current-date" id="currentDate"></div>

            <button
              class="theme-toggle"
              id="themeToggle"
              aria-label="Change theme"
            >
              <i class="fa-solid fa-moon"></i>
            </button>

            <button class="notification-btn" aria-label="Notifications">
              <i class="fa-regular fa-bell"></i>
            </button>

            <div class="user-profile">
              <div class="user-avatar">
                <i class="fa-solid fa-user"></i>
              </div>

              <div class="user-info">
                <span class="user-name">My Account</span>
                <small>Welcome</small>
              </div>
            </div>
          </div>
        </header>

        <!-- CALENDAR MAIN CONTENT -->
        <main class="main-content">
          <!-- CALENDAR HEADER -->
          <section class="calendar-page-header">
            <div>
              <h1>My Calendar</h1>
              <p>Plan your time and organize your tasks.</p>
            </div>
          </section>

          <!-- CALENDAR TOOLBAR -->
          <section class="calendar-toolbar">
            <!-- DATE NAVIGATION -->
            <div class="calendar-navigation">
              <button
                id="previousDate"
                class="calendar-nav-btn"
                aria-label="Previous date"
              >
                <i class="fa-solid fa-chevron-left"></i>
              </button>

              <button id="todayBtn" class="calendar-today-btn">Today</button>

              <button
                id="nextDate"
                class="calendar-nav-btn"
                aria-label="Next date"
              >
                <i class="fa-solid fa-chevron-right"></i>
              </button>

              <h2 id="calendarCurrentDate">November 2026</h2>
            </div>

            <!-- VIEW OPTIONS -->
            <div class="calendar-view-options">
              <button class="calendar-view-btn active" data-view="day">
                Daily
              </button>

              <button class="calendar-view-btn" data-view="week">Weekly</button>

              <button class="calendar-view-btn" data-view="month">
                Monthly
              </button>
            </div>
          </section>

          <!-- CALENDAR VIEW -->
          <section class="calendar-view-section">
            <div id="calendarGrid" class="calendar-grid">
              <!-- Calendar grid will be rendered here -->
            </div>
          </section>

          <!-- UNSCHEDULED TASKS -->
          <section class="unscheduled-section">
            <div class="section-title">
              <h2>Unscheduled Tasks</h2>
              <p>Tasks without a scheduled time.</p>
            </div>

            <div id="unscheduledTasks">
              <!-- Unscheduled tasks will be rendered here -->
            </div>
          </section>
        </main>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
    <script type="module" src="/src/calendar.js"></script>
  </body>
</html>
